[project]
name = "asl-shop"
version = "0.2.0"
description = "ASL letter recognition desktop app"
requires-python = ">=3.10"
dependencies = [
    "mediapipe<1.0",
    "numpy",
    "opencv-contrib-python",
    "opencv-python>=5.0.0.93",
    "pandas",
    "scikit-learn>=1.7.2",
    "torch>=2.14.1",
    "tqdm",
    "matplotlib",
]

[tool.uv]
package = false

[project.optional-dependencies]
neural = ["torch>=2.7", "PyYAML>=6.0"]
